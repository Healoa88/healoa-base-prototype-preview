# Move to .github/workflows/tests.yml to enable (needs a token with `workflow` scope to push).
name: tests
on:
  pull_request:
  push:
    branches: [main]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm i --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run shots
        env:
          HEALOA_SHOTS_DIR: shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shots
          path: shots
